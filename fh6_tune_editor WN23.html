<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forza Horizon 6 — Tune Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--bg2:#131316;--bg3:#1a1a1f;--bg4:#222228;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0f4;--text2:#9898a8;--text3:#58585e;
  --accent:#ff4500;--accent2:#ff6a33;--accent-dim:rgba(255,69,0,0.12);
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--purple:#e879f9;
  --radius:8px;--radius-lg:12px;
  --mono:'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani','Barlow',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;}
.site-header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.logo-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:3px;}
.header-meta{font-size:12px;color:var(--text3);}
.main{display:flex;height:calc(100vh - 56px);overflow:hidden;}
.sidebar{width:300px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.sidebar-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:1rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--bg3);}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-dim);}
.upload-zone input{display:none;}
.upload-zone p{font-size:12px;color:var(--text2);}
.tune-list{flex:1;overflow-y:auto;padding:.5rem;}
.tune-item{border-radius:var(--radius);padding:.75rem 1rem;cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background .15s,border-color .15s;}
.tune-item:hover{background:var(--bg3);border-color:var(--border);}
.tune-item.active{background:var(--accent-dim);border-color:var(--accent);}
.tune-item-car{font-size:13px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent2);}
.tune-item-title{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tune-item-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;margin-top:3px;align-items:center;}
.editor{flex:1;overflow-y:auto;padding:1.5rem 2rem;background:var(--bg);}
.empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);}
.empty-state-icon{font-size:48px;opacity:.4;}
.empty-state h2{font-size:18px;font-weight:500;color:var(--text2);}
.empty-state p{font-size:13px;text-align:center;max-width:280px;}
.tune-header{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:1.5rem;}
.tune-car-name{font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--accent2);margin-bottom:4px;}
.tune-file-name{font-size:12px;color:var(--text3);}
.tune-meta-row{display:flex;gap:2rem;margin-top:10px;flex-wrap:wrap;}
.tune-meta-item{font-size:12px;color:var(--text2);}
.tune-meta-item strong{color:var(--text);font-weight:600;}
.tune-actions{display:flex;gap:8px;}
.btn{padding:8px 18px;border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:none;transition:opacity .15s,transform .1s;white-space:nowrap;}
.btn:hover{opacity:.88;}.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--bg4);color:var(--text);border:1px solid var(--border2);}
.tab-bar{display:flex;gap:4px;padding:0 2rem;border-bottom:1px solid var(--border);background:var(--bg2);margin:-1.5rem -2rem 1.5rem;}
.tab{padding:10px 16px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--text2);}.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel{display:none;}.panel.active{display:block;}
.section{margin-bottom:1.5rem;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.section-title{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);}
.section-badge{font-size:10px;padding:2px 8px;border-radius:3px;background:var(--bg4);color:var(--text3);font-weight:600;}
.upgrade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.upgrade-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;}
.upgrade-card.installed{border-color:var(--border2);}.upgrade-card.na{opacity:.3;}
.upg-label{font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;}
.upg-tier{font-size:13px;font-weight:700;}
.t-stock{color:var(--text2);}.t-street{color:#60a5fa;}.t-sport{color:var(--amber);}.t-race{color:var(--green);}.t-elite{color:var(--purple);}.t-body{color:var(--accent2);}
.upg-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.tuning-cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:900px){.tuning-cols{grid-template-columns:1fr;}}
.tuning-col-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem;}
.tuning-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem 1rem;margin-bottom:6px;}
.tuning-row-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.tuning-label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);}
.tuning-unit{font-size:10px;color:var(--text3);margin-left:4px;}
.tuning-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent2);}
.tuning-val.na{color:var(--text3);font-size:12px;font-weight:400;}
input[type=range]{width:100%;height:4px;cursor:pointer;background:var(--bg4);border-radius:2px;-webkit-appearance:none;appearance:none;margin-top:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2);box-shadow:0 0 0 1px var(--accent);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2);}
.tuning-note{font-size:10px;color:var(--text3);margin-top:3px;font-style:italic;}
.fd-big{background:var(--bg2);border:1px solid rgba(255,106,51,.3);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem;}
.fd-row{display:flex;align-items:flex-end;gap:2rem;flex-wrap:wrap;}
.fd-item label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);display:block;margin-bottom:4px;}
.fd-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent2);}
.fd-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.gear-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.gear-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;}
.gear-card.active{border-color:rgba(255,106,51,.4);}.gear-card.inactive{opacity:.3;}
.gear-name{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}
.gear-val{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:4px;color:var(--text);}
.gear-val.na{color:var(--text3);font-size:13px;font-weight:400;}
.gear-sub{font-size:10px;color:var(--text3);margin-top:4px;}
pre.hex{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;overflow:auto;max-height:500px;white-space:pre;}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--green);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;transform:translateY(80px);opacity:0;transition:transform .25s,opacity .25s;z-index:9999;}
.toast.show{transform:translateY(0);opacity:1;}.toast.err{background:var(--accent);}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
</style>
</head>

  </div>
</div>

function displayVal(kind,raw){
  if(isNaN(raw)||raw===undefined)return null;
  switch(kind){
    case 'pct_note':   return(raw*100).toFixed(1)+'%';
    case 'pct100':     return(raw*100).toFixed(0)+'%';
    case 'brake_pres': return(raw*100+100).toFixed(0)+'%';
    case 'brake_bal':  return((1-raw)*100).toFixed(0)+'% F / '+(raw*100).toFixed(0)+'% R';
    case 'tire_psi':   return(raw*43+22).toFixed(1)+' PSI';
    case 'camber':     return(raw*-5).toFixed(2)+'°';
    case 'toe':        return((raw-0.5)*6).toFixed(2)+'°';
    case 'caster':     return(raw*6+1).toFixed(1)+'°';
    case 'arb':        return(raw*65+1).toFixed(1);
    case 'damp':       return(raw*20).toFixed(1);
    default:           return raw.toFixed(3);
  }
}
function rawToSlider(kind,raw){return kind==='camber'?(1-raw)*100:raw*100;}
function sliderToRaw(kind,s){return kind==='camber'?1-(s/100):s/100;}

// Gear & final drive conversions (confirmed from tune data analysis)
function gearRatio(raw){
  if(isNaN(raw)||raw<0)return null;
  const r=raw*5.0;
  return r<0.1?null:r;
}
function fdRatio(raw){
  if(isNaN(raw))return null;
  return raw*4.0+2.0;
}

function parseTune(buffer,fileName){
  const bytes=new Uint8Array(buffer),view=new DataView(buffer),size=bytes.length;
  if(![598,386,378].includes(size))return null;
  const isFH6=size===598,vb=bytes[0],ordinal=view.getUint32(2,true),n=vb===2?46:48;
  const upgrades=[];
  for(let i=0;i<n;i++){
    const raw=view.getUint32(10+i*4,true);
    upgrades.push(raw===0xFFFFFFFF?{present:false,raw}:{present:true,raw,key:Math.floor(raw/1000),idx:raw%1000});
  }
  while(upgrades.length<48)upgrades.push({present:false,raw:0xFFFFFFFF});
  const off=isFH6?414:(10+n*4),tuning=[];
  for(let i=0;i<46;i++)tuning.push(off+i*4+4<=size?view.getFloat32(off+i*4,true):NaN);
  return{fileName,vb,ordinal,isFH6,n,upgrades,tuning,raw:new Uint8Array(buffer)};
}
function buildBuf(tune,upgrades,tuning){
  const buf=tune.raw.slice(),view=new DataView(buf.buffer);
  for(let i=0;i<tune.n;i++)view.setUint32(10+i*4,upgrades[i].raw>>>0,true);
  const off=tune.isFH6?414:(10+tune.n*4);
  for(let i=0;i<46;i++)view.setFloat32(off+i*4,tuning[i],true);
  return buf;
}

function renderUpgCard(si,upg,ordinal){
  const slot=UPG_SLOTS[si]||'?',kind=UPG_KIND[si]||'perf';
  if(!upg||!upg.present)return`<div class="upgrade-card na"><div class="upg-label">${slot}</div><div class="upg-tier t-stock">—</div></div>`;
  const{key,idx}=upg;
  let tier='',tc='t-stock',sub='';
  if(kind==='wheel'){tier=idx===0?'Stock':`Custom #${idx}`;tc=idx===0?'t-stock':'t-elite';sub=`ID ${upg.raw}`;}
  else if(kind==='body'){
    if(idx<5){tier=TIER_NAMES[idx];tc=TIER_CLASS[idx];}
    else if(idx>=100){tier=`Body part #${idx-100}`;tc='t-body';}
    else{tier=`Part #${idx}`;tc='t-body';}
    const cn=carName(key);sub=cn&&key!==0?cn:(key?`Car ${key}`:'');
  }else{
    tier=idx<=4?TIER_NAMES[idx]:`Level ${idx}`;tc=idx<=4?TIER_CLASS[idx]:'t-body';
    if(key!==ordinal&&key!==0){const dn=carName(key);sub=dn?`🔄 Swap: ${dn}`:`🔄 Swap (key ${key})`;}
    else{const cn=carName(key);sub=cn&&key!==0?cn:'';}
  }
  return`<div class="upgrade-card installed"><div class="upg-label">${slot}</div><div class="upg-tier ${tc}">${tier}</div>${sub?`<div class="upg-sub">${sub}</div>`:''}</div>`;
}

function renderTuningRow(key,fd,tuning){

  const pair=fd.pair?`<span class="tuning-unit">${fd.pair}</span>`:'';

  const sv=Math.max(0,Math.min(100,rawToSlider(fd.kind,raw)));
  const isApprox=fd.kind==='pct_note';
  const note=isApprox?`<div class="tuning-note">⚠ Car-specific range — slider position shown</div>`:'';
  return`<div class="tuning-row"><div class="tuning-row-header"><span class="tuning-label">${fd.label}${pair}</span><span class="tuning-val" id="tv-${key}">${dv}</span></div><input type="range" min="0" max="100" step="0.1" value="${sv.toFixed(1)}" data-key="${key}" data-fi="${fd.i}" data-kind="${fd.kind}" oninput="onTuning(this)">${note}</div>`;
}

function renderGearCard(g,raw){
  const ratio=gearRatio(raw),active=ratio!==null;
  const sv=active?Math.max(0,Math.min(100,raw*100)):50;

}

  const dt=dtCode(tune.ordinal);

  const upgSec=UPG_SECTIONS.map(s=>{
    const cards=s.idx.map(i=>renderUpgCard(i,tune.upgrades[i],tune.ordinal)).join('');
    return`<div class="section"><div class="section-header"><span class="section-title">${s.label}</span></div><div class="upgrade-grid">${cards}</div></div>`;
  }).join('');

  function col(keys){return keys.map(k=>renderTuningRow(k,TUNING_FIELDS[k],tune.tuning)).join('');}

  const tuneHTML=`
    <div class="section"><div class="section-header"><span class="section-title">Aerodynamics & Drivetrain</span></div>
      <div class="tuning-cols">
        <div>${col(['aero_front','aero_rear'])}</div>
        <div>${col(['brake_pres','brake_bal','torque_spl','power_bias'])}</div>
      </div></div>
    <div class="section"><div class="section-header"><span class="section-title">Front</span><span class="section-badge">Alignment & Suspension</span></div>
      <div class="tuning-cols">
        <div><div class="tuning-col-label">Alignment</div>${col(['camber_f','toe_f','caster'])}</div>
        <div><div class="tuning-col-label">Suspension</div>${col(['springs_f','arb_f','rh_f','bump_f','rebound_f'])}</div>
      </div></div>
    <div class="section"><div class="section-header"><span class="section-title">Front</span><span class="section-badge">Differential & Tires</span></div>
      <div class="tuning-cols"><div>${col(['accel_f','decel_f'])}</div><div>${col(['tire_pf'])}</div></div></div>
    <div class="section"><div class="section-header"><span class="section-title">Rear</span><span class="section-badge">Alignment & Suspension</span></div>
      <div class="tuning-cols">
        <div><div class="tuning-col-label">Alignment</div>${col(['camber_r','toe_r'])}</div>
        <div><div class="tuning-col-label">Suspension</div>${col(['springs_r','arb_r','rh_r','bump_r','rebound_r'])}</div>
      </div></div>
    <div class="section"><div class="section-header"><span class="section-title">Rear</span><span class="section-badge">Differential & Tires</span></div>
      <div class="tuning-cols"><div>${col(['accel_r','decel_r'])}</div><div>${col(['tire_pr'])}</div></div></div>`;

  const fdRaw=tune.tuning[2];
  const fdV=fdRatio(fdRaw);
  const fdDisplay=fdV!==null?fdV.toFixed(3):'N/A';
  const fdSv=!isNaN(fdRaw)?Math.max(0,Math.min(100,fdRaw*100)):50;

  const gearCards=Array.from({length:10},(_,i)=>renderGearCard(i+1,tune.tuning[36+i])).join('');

  const gearsHTML=`
    <div class="fd-big">
      <div class="fd-row">
        <div>
          <label>Final Drive Ratio</label>
          <div class="fd-val" id="fd-val">${fdDisplay}</div>
          <div class="fd-sub">range ~2.00 – 6.00 (raw × 4 + 2)</div>
          <input type="range" min="0" max="100" step="0.1" value="${fdSv.toFixed(1)}" style="width:240px;margin-top:8px;display:block;" data-gear="0" data-idx="2" oninput="onGear(this)">
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title">Individual Gear Ratios</span><span class="section-badge">raw × 5.0</span></div>
      <div class="gear-grid">${gearCards}</div>
    </div>`;

  ed.innerHTML=`<div style="max-width:1100px;margin:0 auto;">
    <div class="tune-header">
      <div>
        <div class="tune-car-name">${car}</div>
        <div class="tune-file-name">${tune.fileName}</div>
        <div class="tune-meta-row">
          <div class="tune-meta-item">Ordinal <strong>${tune.ordinal}</strong></div>
          <div class="tune-meta-item">Format <strong>${tune.isFH6?'FH6 v3':'Legacy'}</strong></div>
          ${dt?`<div class="tune-meta-item">Drive <strong>${dtLabel(dt)}</strong></div>`:''}
        </div>
      </div>
      <div class="tune-actions">
        <button class="btn btn-primary" onclick="downloadTune()">⬇ Save File</button>
        <button class="btn btn-secondary" onclick="copySummary()">📋 Summary</button>
      </div>
    </div>
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab(this,'p-upgrades')">Upgrades</div>
      <div class="tab" onclick="switchTab(this,'p-tuning')">Tuning</div>
      <div class="tab" onclick="switchTab(this,'p-gears')">Gears & Final Drive</div>
      <div class="tab" onclick="switchTab(this,'p-raw')">Raw Hex</div>
    </div>
    <div class="panel active" id="p-upgrades">${upgSec}</div>
    <div class="panel" id="p-tuning">${tuneHTML}</div>
    <div class="panel" id="p-gears">${gearsHTML}</div>
    <div class="panel" id="p-raw"><div class="section"><div class="section-header"><span class="section-title">Hex dump</span></div><pre class="hex">${hexDump(tune.raw)}</pre></div></div>
  </div>`;
}

function hexDump(b){let o='';for(let i=0;i<b.length;i+=16){const c=Array.from(b.slice(i,i+16));o+=i.toString(16).padStart(4,'0')+'  '+c.map(x=>x.toString(16).padStart(2,'0')).join(' ').padEnd(47)+'  '+c.map(x=>x>=32&&x<127?String.fromCharCode(x):'.').join('')+'\n';}return o;}

function onTuning(inp){
  const k=inp.dataset.key,fi=parseInt(inp.dataset.fi),kind=inp.dataset.kind;
  mod.tuning[fi]=sliderToRaw(kind,parseFloat(inp.value));
  document.getElementById('tv-'+k).textContent=displayVal(kind,mod.tuning[fi]);
}
function onGear(inp){
  const g=parseInt(inp.dataset.gear),idx=parseInt(inp.dataset.idx),raw=parseFloat(inp.value)/100;
  mod.tuning[idx]=raw;
  if(g===0){const v=fdRatio(raw);document.getElementById('fd-val').textContent=v!==null?v.toFixed(3):'N/A';}
  else{const r=gearRatio(raw);document.getElementById('gv-'+g).textContent=r!==null?r.toFixed(3):'—';}
}
function switchTab(el,pid){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');document.getElementById(pid).classList.add('active');
}
function downloadTune(){
  if(cur===null)return;
  const t=tunes[cur],buf=buildBuf(t,mod.upgrades,mod.tuning);
  const url=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;a.download=t.fileName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('Tune saved!');
}
function copySummary(){
  if(cur===null)return;
  const t=tunes[cur],car=carName(t.ordinal)||`Car #${t.ordinal}`;
  const dt=dtCode(t.ordinal);
  const lines=[`=== ${car}${dt?' ('+dtLabel(dt)+')':''} ===`,`File: ${t.fileName}`,`Ordinal: ${t.ordinal}`,'','--- Upgrades ---'];
  t.upgrades.forEach((u,i)=>{
    if(!u.present)return;
    const slot=UPG_SLOTS[i]||'?',kind=UPG_KIND[i]||'perf';
    let desc=kind==='wheel'?`Custom #${u.idx}`:kind==='body'?(u.idx>=100?`Body part #${u.idx-100}`:(TIER_NAMES[u.idx]||`Part ${u.idx}`)):(u.idx<=4?TIER_NAMES[u.idx]:`Level ${u.idx}`);
    const donor=carName(u.key);
    lines.push(`  ${slot}: ${desc}${donor&&u.key!==t.ordinal&&u.key!==0?' (swap: '+donor+')':''}`);
  });
  lines.push('','--- Tuning ---');
  Object.entries(TUNING_FIELDS).forEach(([k,fd])=>{
    const raw=t.tuning[fd.i];if(isNaN(raw))return;
    lines.push(`  ${fd.label}${fd.pair?' ('+fd.pair+')':''}: ${displayVal(fd.kind,raw)}`);
  });
  lines.push('','--- Gears ---');
  const fdV=fdRatio(t.tuning[2]);
  lines.push(`  Final drive: ${fdV!==null?fdV.toFixed(3):'N/A'}`);
  for(let g=1;g<=10;g++){const r=gearRatio(t.tuning[36+g]);if(r!==null)lines.push(`  Gear ${g}: ${r.toFixed(3)}`);}
  navigator.clipboard.writeText(lines.join('\n'));
  showToast('Summary copied!');
}
function showToast(msg,err){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2500);
}
function renderList(){
  const el=document.getElementById('tuneList');
  if(!tunes.length){el.innerHTML='<div style="padding:1rem;text-align:center;color:var(--text3);font-size:12px;">No tunes loaded.</div>';return;}
  el.innerHTML=tunes.map((t,i)=>{
    const car=carName(t.ordinal)||`Car #${t.ordinal}`;
    return`<div class="tune-item${cur===i?' active':''}" onclick="selectTune(${i})">
      <div class="tune-item-car">${car}</div>
      <div class="tune-item-title">${t.fileName}</div>
      <div class="tune-item-meta"><span>#${t.ordinal}</span><span>${t.isFH6?'FH6 v3':'Legacy'}</span></div>
    </div>`;
  }).join('');
}
function selectTune(idx){
  cur=idx;const t=tunes[idx];
  mod={upgrades:t.upgrades.map(u=>({...u})),tuning:[...t.tuning]};
  renderList();renderEditor(t);
}
async function loadFile(file){
  const buf=await file.arrayBuffer(),p=parseTune(buf,file.name);
  if(!p){showToast(`${file.name}: unrecognised format`,true);return;}
  tunes.push(p);renderList();
  if(tunes.length===1)selectTune(0);else showToast(`Loaded ${file.name}`);
}
const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',async e=>{for(const f of e.target.files)await loadFile(f);e.target.value='';});
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',async e=>{e.preventDefault();dz.classList.remove('dragover');for(const f of e.dataTransfer.files)await loadFile(f);});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',async e=>{e.preventDefault();if(!e.target.closest('#dropZone'))for(const f of e.dataTransfer.files)await loadFile(f);});
</script>
</body>
</html>
